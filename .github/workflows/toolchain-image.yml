# Toolchain Image — build and publish the pinned build environment to GHCR.
# Manual dispatch only (project rule 13.2: builds are intentional, never
# triggered by file changes). Published digest is recorded by hand into
# build/docker/image.lock through a reviewed pull request: this workflow takes
# no repository write permissions for automation (project rule 13.4).
name: Toolchain Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR (false = dry build test)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish builder image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read environment version
        id: env
        run: |
          v="$(grep -E '^ENV_VERSION=' build/docker/ENV_VERSION | head -n1 | cut -d= -f2-)"
          [ -n "$v" ] || { echo "ENV_VERSION missing in build/docker/ENV_VERSION" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Read pinned build environment
        id: pins
        run: |
          get() { grep -E "^$1=" build/docker/toolchain.env | head -n1 | cut -d= -f2-; }
          b="$(get BASE_IMAGE)"
          [ -n "$b" ] || { echo "BASE_IMAGE not chosen (Phase 1/2 task); refusing to build an unpinned image" >&2; exit 1; }
          {
            echo "base_image=$b"
            echo "base_digest=$(get BASE_DIGEST)"
            echo "clang_repo=$(get CLANG_REPO_URL)"
            echo "clang_ref=$(get CLANG_REF)"
            echo "clang_pin=$(get CLANG_PIN)"
            echo "mkbootimg_repo=$(get MKBOOTIMG_REPO_URL)"
            echo "mkbootimg_ref=$(get MKBOOTIMG_REF)"
            echo "mkbootimg_pin=$(get MKBOOTIMG_PIN)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and verify base image digest
        id: digest
        run: |
          set -e
          img='${{ steps.pins.outputs.base_image }}'
          json="$(docker buildx imagetools inspect "$img" --format '{{json .}}')"
          d="$(printf '%s' "$json" | jq -r '
            def amd64(e):
              (e.annotations["com.docker.official-images.bashbrew.arch"]? == "amd64")
              or ((e.platform.os? // "") == "linux" and (e.platform.architecture? // "") == "amd64")
              or ((e.Platform.OS? // "") == "linux" and (e.Platform.Architecture? // "") == "amd64");
            if (.manifests? | type) == "object"
            then [ .manifests | to_entries[] | select(.value | amd64(.)) | .key ][0]
            elif (.manifests? | type) == "array"
            then [ .manifests[] | select(amd64(.)) | .digest ][0]
            elif ((.manifest.manifests? // []) | length) > 0
            then [ .manifest.manifests[] | select(amd64(.)) | .digest ][0]
            elif ((.Manifest.Manifests? // []) | length) > 0
            then [ .Manifest.Manifests[] | select(amd64(.)) | .Digest ][0]
            else empty end')
          idx="$(printf '%s' "$json" | jq -r '.manifest.digest? // .Descriptor.digest? // empty')"
          [ -n "$d" ] || { echo "could not resolve amd64 digest for $img" >&2; printf '%s\n' "$json" >&2; exit 1; }
          echo "index digest:  $idx"
          echo "resolved amd64 digest: $d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          expected='${{ steps.pins.outputs.base_digest }}'
          if [ -n "$expected" ]; then
            if [ "$expected" != "$d" ]; then
              { echo "ERROR: base image digest drifted: pinned=$expected resolved=$d"; } >&2
              exit 1
            fi
            echo "base image digest matches the pin"
          else
            echo "BASE_DIGEST is empty (first run): record the digest printed above into build/docker/toolchain.env via a reviewed PR"
          fi
          {
            echo '## Base image digest'
            echo '```text'
            echo "BASE_DIGEST=$d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: build/docker
          file: build/docker/Dockerfile
          push: ${{ inputs.push }}
          build-args: |
            BASE_IMAGE=${{ steps.pins.outputs.base_image }}
            CLANG_REPO_URL=${{ steps.pins.outputs.clang_repo }}
            CLANG_REF=${{ steps.pins.outputs.clang_ref }}
            CLANG_PIN=${{ steps.pins.outputs.clang_pin }}
            MKBOOTIMG_REPO_URL=${{ steps.pins.outputs.mkbootimg_repo }}
            MKBOOTIMG_REF=${{ steps.pins.outputs.mkbootimg_ref }}
            MKBOOTIMG_PIN=${{ steps.pins.outputs.mkbootimg_pin }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lexing-kernel-builder:${{ steps.env.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lexing-kernel-builder:latest

      - name: Publish digest for manual write-back
        run: |
          printf 'IMAGE_REF=ghcr.io/%s/lexing-kernel-builder@%s\n' "$GITHUB_REPOSITORY_OWNER" "${{ steps.build.outputs.digest }}" > image-digest.txt
          {
            echo '## Builder image published'
            echo '```text'
            cat image-digest.txt
            echo '```'
            echo 'Copy this line into build/docker/image.lock via a reviewed pull request.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 30
