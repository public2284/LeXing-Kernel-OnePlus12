id: root/susfs
name: SUSFS
description: |
  内核态隐藏与伪造套件：路径隐藏、挂载隐藏、maps/kstat 伪造、uname/cmdline 伪造、
  AVC 日志伪造。设备现有 KSU_SUSFS 全套；新版随 SukiSU 内置（路线 A）。
  注意：SukiSU-Nova v3.0.0 的 kernel/Kconfig 不定义 CONFIG_KSU_SUSFS，
  Kbuild 将 extension/susfs_extension.o 无条件编入 kernelsu，故路线 A 下
  SUSFS 没有独立的编译期开关；启用粒度由运行期管理器清单控制。
type: hybrid
default_state: enabled
risk: medium
source:
  repo: https://github.com/SukiSU-Nova/SukiSU-Nova
  component: kernel/extension/susfs_extension
  license: GPL-3.0-or-later
dependencies:
  - root/sukisu-nova
conflicts: []
kconfig:
  - CONFIG_KSU=y
  # CONFIG_KSU_SUSFS 在 SukiSU-Nova v3.0.0 中不存在（无编译期开关）；
  # 需要编译期关闭 SUSFS 时改用路线 B 独立补丁（见 SUSFS_INTEGRATION_PLAN）。
compatibility:
  device: OnePlus 12 CPH2573
  kernel_branch: android14-6.1
  status: REGISTERED
enable: 随镜像刷入生效（v3.0.0 下随 CONFIG_KSU 无条件编入）；用户态清单由管理器下发
disable: 清空管理器 SUSFS 清单（运行期）；彻底移除需关闭 CONFIG_KSU（会同时移除 root）或改用路线 B
rollback: dd 回原 boot 镜像 + 恢复 susfs_config 备份

